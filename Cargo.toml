[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
kintrel-core = { path = "crates/kintrel-core" }
kintrel = { path = "crates/kintrel" }
kintrel-lang = { path = "crates/kintrel-lang" }
kintrel-ci = { path = "crates/kintrel-ci" }
anyhow = "1"
blake3 = "1.8"
postcard = { version = "1.1", features = ["use-std"] }
diffy = "0.5"
gix = { version = "0.90", default-features = false, features = ["sha1"] }
proptest = "1.12"
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
reflink-copy = "0.1"
ignore = "0.4"
globset = "0.4"
toml = "1"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
zstd = "0.14"
