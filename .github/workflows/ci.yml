name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RAPPCT_DEBUG_LAUNCH: "1"  # rappct prints the Win32 error of a failed AppContainer launch
    steps:
      - uses: actions/checkout@v4
      # The toolchain is pinned in rust-toolchain.toml; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Bubblewrap for the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Git identity for the tests that commit
        run: |
          git config --global user.name ci
          git config --global user.email ci@ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Diagnostics (temporary) from a folder under LOCALAPPDATA
        if: always() && runner.os == 'Windows'
        shell: bash
        run: KT_DIAG_DIR="$LOCALAPPDATA/kintrel/diag-$RANDOM" cargo test -p kintrel --test diag_windows -- --nocapture || true
