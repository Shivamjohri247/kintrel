name: release

# Pushing a `v*` tag builds `kintrel` for each OS and publishes a GitHub release with the archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          # 22.04's older glibc lets the binary run on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --locked -p kintrel
      - name: Package
        shell: bash
        run: |
          name=kintrel-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/kintrel.exe "$name"/
            7z a -bd "$name.zip" "$name" >/dev/null
          else
            cp target/release/kintrel "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            kintrel-*.tar.gz
            kintrel-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum kintrel-*.tar.gz kintrel-*.zip > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kintrel-*.tar.gz kintrel-*.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Kintrel $GITHUB_REF_NAME" --generate-notes
